name: Weekly climbing poll

on:
  workflow_dispatch:
  schedule:
    # 8:00pm Sunday in Singapore. GitHub schedules use UTC.
    - cron: "0 12 * * 0"

jobs:
  send-poll:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install bot
        run: python -m pip install -e .

      - name: Send Telegram poll
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          POLL_QUESTION: Which climbing gym should we visit next?
        run: climb-bot-send-poll
